<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cairo's School — Weekly Timetable</title>
<style>
/* ── Design tokens (Alpha School system) ─────────────────────────── */
:root {
  --c-header:  #ff6b35;
  --c-focus:   #e65100;
  --c-bg:      #fff8f0;
  --c-card:    #ffffff;
  --c-text:    #1f2937;
  --c-muted:   #6b7280;
  --c-shadow:  0 3px 14px rgba(0,0,0,0.10);
  --c-done:    #16a34a;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;

  --am-bg:     #eef7ff;
  --am-text:   #1e40af;
  --am-badge:  #dbeafe;

  --pm-bg:     #fff8e8;
  --pm-text:   #92400e;
  --pm-badge:  #fef3c7;

  --cs-bg:     #f3f4f6;
  --cs-border: #e5e7eb;
  --cs-text:   #9ca3af;

  --sum-bg:     #f0fdf4;
  --sum-border: #bbf7d0;
  --sum-text:   #14532d;
}

@media (prefers-color-scheme: dark) {
  :root {
    --c-bg:      #1a1410;
    --c-card:    #26201a;
    --c-text:    #f0e4d4;
    --c-muted:   #9a8878;
    --c-shadow:  0 3px 16px rgba(0,0,0,0.45);
    --am-bg:     #101e2e;
    --am-text:   #93c5fd;
    --am-badge:  #1e3a5f;
    --pm-bg:     #221a06;
    --pm-text:   #fcd34d;
    --pm-badge:  #3d2d04;
    --cs-bg:     #211d19;
    --cs-border: #302a24;
    --cs-text:   #5c5248;
    --sum-bg:    #052e16;
    --sum-border:#166534;
    --sum-text:  #86efac;
  }
}
:root[data-theme="dark"] {
  --c-bg:#1a1410;--c-card:#26201a;--c-text:#f0e4d4;--c-muted:#9a8878;
  --c-shadow:0 3px 16px rgba(0,0,0,0.45);
  --am-bg:#101e2e;--am-text:#93c5fd;--am-badge:#1e3a5f;
  --pm-bg:#221a06;--pm-text:#fcd34d;--pm-badge:#3d2d04;
  --cs-bg:#211d19;--cs-border:#302a24;--cs-text:#5c5248;
  --sum-bg:#052e16;--sum-border:#166534;--sum-text:#86efac;
}
:root[data-theme="light"] {
  --c-bg:#fff8f0;--c-card:#ffffff;--c-text:#1f2937;--c-muted:#6b7280;
  --c-shadow:0 3px 14px rgba(0,0,0,0.10);
  --am-bg:#eef7ff;--am-text:#1e40af;--am-badge:#dbeafe;
  --pm-bg:#fff8e8;--pm-text:#92400e;--pm-badge:#fef3c7;
  --cs-bg:#f3f4f6;--cs-border:#e5e7eb;--cs-text:#9ca3af;
  --sum-bg:#f0fdf4;--sum-border:#bbf7d0;--sum-text:#14532d;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 18px;
  line-height: 1.5;
  background: var(--c-bg);
  color: var(--c-text);
  min-height: 100vh;
}

/* ── Header ──────────────────────────────────────────────────────── */
.site-header {
  background: var(--c-header);
  color: #fff;
  padding: 1.25rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.logo {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-size: clamp(1.3rem, 4vw, 1.8rem);
  font-weight: 900;
  letter-spacing: -0.03em;
}
.logo-star {
  display: inline-block;
  font-size: 1.5rem;
  animation: spin-slow 10s linear infinite;
}
@keyframes spin-slow { to { transform: rotate(360deg); } }

.header-meta { text-align: right; line-height: 1.3; }
.header-greeting { font-size: 1rem; font-weight: 700; }
.header-date     { font-size: 0.85rem; opacity: 0.82; }

/* ── Week tracker (read-only, no navigation) ─────────────────────── */
.week-bar {
  background: var(--c-card);
  border-bottom: 2px solid var(--c-bg);
  padding: 0.85rem 1.5rem;
  display: flex;
  gap: 0.6rem;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.week-bar::-webkit-scrollbar { display: none; }

/* Each day is a display element only — not a button */
.day-chip {
  flex: 1 0 64px;
  max-width: 140px;
  min-height: 72px;
  border: 2px solid transparent;
  border-radius: var(--radius-md);
  background: var(--c-bg);
  color: var(--c-text);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.2rem;
  padding: 0.5rem 0.4rem;
  /* Not interactive — pointer-events kept default so it's visible but not actionable */
  user-select: none;
  cursor: default;
  opacity: 0.45; /* future/past days fade back */
}

.day-chip.today {
  opacity: 1;
  background: var(--c-header);
  color: #fff;
  box-shadow: 0 4px 14px rgba(255,107,53,0.35);
  position: relative;
}
.day-chip.today::before {
  content: 'Today';
  position: absolute;
  top: -11px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.58rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  background: var(--c-header);
  color: white;
  padding: 0.1rem 0.5rem;
  border-radius: 99px;
  white-space: nowrap;
  border: 1.5px solid rgba(255,255,255,0.4);
}

.day-short { font-size: 1rem; font-weight: 900; letter-spacing: -0.01em; }
.day-full  { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.7; }
.day-icons { font-size: 0.8rem; margin-top: 0.1rem; }
.day-chip.today .day-icons { opacity: 0.9; }

/* ── Day panel ───────────────────────────────────────────────────── */
.day-panel {
  max-width: 1040px;
  margin: 0 auto;
  padding: 2rem 1.5rem 3rem;
  display: flex;
  flex-direction: column;
  gap: 1.75rem;
}

/* ── Word of the Day card ────────────────────────────────────────── */
.wotd-card {
  background: #1e1b4b;
  border-radius: var(--radius-lg);
  padding: 1.25rem 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
}

.wotd-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.4rem;
}

.wotd-eyebrow {
  font-size: 0.68rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.6);
}

.wotd-ask {
  font-size: 0.68rem;
  font-weight: 700;
  color: #a5b4fc;
  background: rgba(165,180,252,0.15);
  border-radius: 99px;
  padding: 0.15rem 0.55rem;
}

.wotd-word {
  font-size: clamp(1.8rem, 5vw, 2.6rem);
  font-weight: 900;
  color: #fff;
  letter-spacing: -0.03em;
  line-height: 1;
}

.wotd-syns {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}

.wotd-syn {
  font-size: 0.82rem;
  font-weight: 700;
  color: rgba(255,255,255,0.85);
  background: rgba(255,255,255,0.12);
  border-radius: 99px;
  padding: 0.2rem 0.65rem;
}

.wotd-story {
  font-size: 0.9rem;
  font-weight: 600;
  color: rgba(255,255,255,0.72);
  font-style: italic;
  line-height: 1.45;
  border-left: 3px solid rgba(255,255,255,0.25);
  padding-left: 0.65rem;
  margin-top: 0.1rem;
}

/* ── Time block ──────────────────────────────────────────────────── */
.time-block { border-radius: var(--radius-lg); padding: 1.5rem; }
.time-block.morning   { background: var(--am-bg); }
.time-block.afternoon { background: var(--pm-bg); }

.block-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 1.25rem;
  flex-wrap: wrap;
}
.block-title {
  font-size: clamp(1.1rem, 3vw, 1.4rem);
  font-weight: 900;
  letter-spacing: -0.02em;
}
.morning   .block-title { color: var(--am-text); }
.afternoon .block-title { color: var(--pm-text); }

.time-pill {
  font-size: 0.68rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 0.22rem 0.7rem;
  border-radius: 99px;
}
.morning   .time-pill { background: var(--am-badge); color: var(--am-text); }
.afternoon .time-pill { background: var(--pm-badge); color: var(--pm-text); }

.block-note {
  font-size: 0.78rem;
  color: var(--c-muted);
  font-weight: 600;
  margin-left: auto;
  white-space: nowrap;
}

/* ── Activity grid ───────────────────────────────────────────────── */
.activities {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 1rem;
}

/* ── Activity card ───────────────────────────────────────────────── */
.activity-card {
  background: var(--c-card);
  border-radius: var(--radius-md);
  box-shadow: var(--c-shadow);
  padding: 1.25rem 1.25rem 1.1rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  position: relative;
  transition: transform 0.12s, box-shadow 0.12s;
}
.activity-card:not(.coming-soon):hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}
.activity-card.coming-soon {
  background: var(--cs-bg);
  border: 2px dashed var(--cs-border);
  box-shadow: none;
}
.activity-card.done { border-left: 4px solid var(--c-done); }

.act-icon { font-size: 2.5rem; line-height: 1; user-select: none; }
.act-name {
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--c-text);
  text-wrap: balance;
}
.act-desc {
  font-size: 0.88rem;
  color: var(--c-muted);
  flex: 1;
  line-height: 1.4;
}
.activity-card.coming-soon .act-name,
.activity-card.coming-soon .act-desc { color: var(--cs-text); }

/* Done tick */
.tick-badge {
  position: absolute;
  top: 0.8rem;
  right: 0.85rem;
  width: 1.9rem;
  height: 1.9rem;
  background: var(--c-done);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 0.9rem;
  font-weight: 900;
  box-shadow: 0 2px 6px rgba(22,163,74,0.3);
  animation: pop-in 0.18s ease;
}
@keyframes pop-in {
  from { transform: scale(0); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

/* Start button */
.start-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  min-height: 48px;
  padding: 0.55rem 1.2rem;
  border-radius: var(--radius-sm);
  border: none;
  background: var(--c-header);
  color: #fff;
  font-family: inherit;
  font-weight: 800;
  font-size: 1rem;
  cursor: pointer;
  text-decoration: none;
  transition: background 0.12s, transform 0.1s;
  align-self: flex-start;
  margin-top: 0.15rem;
}
.start-btn:hover  { background: var(--c-focus); }
.start-btn:active { transform: scale(0.97); }
.start-btn:focus  { outline: 3px solid var(--c-focus); outline-offset: 3px; }
.activity-card.done .start-btn { background: var(--c-done); }
.activity-card.done .start-btn:hover { background: #15803d; }

/* Coming soon label */
.soon-tag {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--cs-text);
  margin-top: 0.2rem;
  padding: 0.3rem 0;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

/* ── Day summary ─────────────────────────────────────────────────── */
.day-summary {
  border-radius: var(--radius-lg);
  background: var(--sum-bg);
  border: 2px solid var(--sum-border);
  padding: 1.5rem;
  display: none;
}
.day-summary.visible { display: block; }

.summary-header {
  font-size: 1.2rem;
  font-weight: 900;
  color: var(--sum-text);
  margin-bottom: 0.85rem;
}

.summary-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 1rem;
}
.summary-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  background: rgba(255,255,255,0.5);
  border: 1.5px solid var(--sum-border);
  border-radius: 99px;
  padding: 0.25rem 0.75rem 0.25rem 0.5rem;
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--sum-text);
}
.chip-tick {
  width: 1.3rem;
  height: 1.3rem;
  background: var(--c-done);
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 0.68rem;
  font-weight: 900;
  flex-shrink: 0;
}

.summary-message {
  font-size: 0.98rem;
  color: var(--sum-text);
  font-weight: 600;
  background: rgba(255,255,255,0.45);
  border-radius: var(--radius-sm);
  padding: 0.85rem 1rem;
  line-height: 1.55;
}

/* ── Date card ───────────────────────────────────────────────────── */
.date-card {
  background: var(--c-card);
  border-radius: var(--radius-lg);
  box-shadow: var(--c-shadow);
  padding: 1.5rem 1.75rem;
  display: flex;
  align-items: center;
  gap: 0;
  border-left: 6px solid var(--c-header);
  overflow: hidden;
}

.date-body {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  flex-shrink: 0;
  padding-right: 1.75rem;
  border-right: 2px solid var(--c-bg);
}

.date-label {
  font-size: 0.7rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--c-header);
}

.date-day {
  font-size: clamp(1.8rem, 5vw, 2.6rem);
  font-weight: 900;
  color: var(--c-header);
  letter-spacing: -0.03em;
  line-height: 1;
  white-space: nowrap;
}

.date-parts {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-top: 0.3rem;
}

.date-num {
  font-size: clamp(1.2rem, 3.5vw, 1.7rem);
  font-weight: 900;
  color: var(--c-text);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.date-month {
  font-size: clamp(1.2rem, 3.5vw, 1.7rem);
  font-weight: 900;
  color: var(--c-text);
  line-height: 1;
}

.date-sep {
  color: var(--c-muted);
  font-size: 1.1rem;
  font-weight: 300;
}

.date-year {
  font-size: clamp(0.95rem, 2.5vw, 1.2rem);
  font-weight: 700;
  color: var(--c-muted);
  line-height: 1;
}

/* Quote — right panel */
.date-quote {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 0.7rem;
  padding-left: 1.75rem;
  min-width: 0;
}

.quote-cat {
  font-size: 1.8rem;
  flex-shrink: 0;
  line-height: 1;
  user-select: none;
}

.quote-text {
  font-size: clamp(1rem, 2.8vw, 1.25rem);
  font-weight: 800;
  color: var(--c-text);
  line-height: 1.4;
  text-wrap: balance;
}

/* ── Responsive ──────────────────────────────────────────────────── */
@media (max-width: 640px) {
  .site-header { padding: 1rem; }
  .day-panel   { padding: 1rem 1rem 2.5rem; }
  .time-block  { padding: 1.1rem; }
  .activities  { grid-template-columns: 1fr; }
  .day-btn     { min-height: 70px; }
  .block-note  { display: none; }

  /* Stack date + quote vertically on small screens */
  .date-card   { flex-direction: column; align-items: flex-start; gap: 1rem; }
  .date-body   { border-right: none; padding-right: 0; border-bottom: 2px solid var(--c-bg); padding-bottom: 1rem; width: 100%; }
  .date-quote  { padding-left: 0; }

  /* Challenge + Skill drop back to one column on small screens */
  .paired-row  { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

.spotlight-eyebrow {
  font-size: 0.68rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.65);
}
.spotlight-title {
  font-size: clamp(1.3rem, 3.6vw, 1.7rem);
  font-weight: 900;
  color: #fff;
  letter-spacing: -0.02em;
  line-height: 1.15;
  text-wrap: balance;
}
.spotlight-desc {
  font-size: 0.95rem;
  font-weight: 600;

.spotlight-note {
  font-size: 0.8rem;
  font-weight: 700;

.week-card  { background: #7c2d12; }  /* terracotta — out in the real world */

.paired-row .spotlight-card { height: 100%; }

.wotd-speak-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.2rem;
  height: 2.2rem;
  border: none;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  color: #fff;
  font-size: 1.1rem;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;

.wotd-speak-btn:active { transform: scale(0.93); }
.wotd-speak-btn:focus-visible { outline: 2px solid #a5b4fc; outline-offset: 2px; }
</style>

<script>

/* ── TTS — Web Speech API ───────────────────────────────────────── */
if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.addEventListener('voiceschanged', () => {}, { once: true });
}

function speakSequence(parts, gapMs) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const gap = gapMs ?? 900;
  // 150 ms buffer after cancel() stops Chrome locking up when a tap
  // interrupts a sequence; resume() unpauses if the tab was backgrounded
  setTimeout(() => {
    if (window.speechSynthesis.paused) window.speechSynthesis.resume();
    function next(i) {
      if (i >= parts.length) return;
      const text = String(parts[i] || '').trim();
      if (!text) { setTimeout(() => next(i + 1), gap); return; }
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang  = 'en-GB';
      utt.rate  = 0.88;
      utt.onend = () => setTimeout(() => next(i + 1), gap);
      window.speechSynthesis.speak(utt);
    }
    next(0);
  }, 150);
}

/* ─────────────────────────────────────────────────────────────────

function safeText(s) {
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

// Returns 0–4 (Mon–Fri) or null for weekends
function todayWeekdayIndex() {
  const d = new Date().getDay(); // 0 Sun, 6 Sat
  if (d === 0 || d === 6) return null;
  return d - 1;
}

// True on the last weekday of the calendar month — i.e. the next
// weekday belongs to a different month.
function isLastSchoolDayOfMonth(d) {
  const date = new Date(d);
  const month = date.getMonth();
  const next = new Date(date);
  next.setDate(next.getDate() + 1);
  while (next.getDay() === 0 || next.getDay() === 6) next.setDate(next.getDate() + 1);
  return next.getMonth() !== month;
}

// End-of-month public-speaking prompt — replaces one afternoon activity
// on the last school day of the month, tied to whatever This Month's
// Skill actually was. Reuses the normal activity-card shape (see
// cardHTML's noLink branch) rather than being a bespoke card type.
function presentationActivity() {
  const s = skillForThisMonth();
  return {
    id:   'present-skill',
    icon: '🎤',
    name: 'Present Your Skill',
    desc: `Present ${s.present} to the family — show what you've been practising all month.`,
    noLink: true,
  };
}

// Today's afternoon list, with the end-of-month swap applied if it's
// the day for it. Replaces Why's That (last slot) — the day's two
// subject activities stay put.
function todaysAfternoon(idx) {
  const base = SCHEDULE[idx].afternoon;
  if (!isLastSchoolDayOfMonth(new Date())) return base;
  const swapped = base.slice();
  swapped[swapped.length - 1] = presentationActivity();
  return swapped;
}

function activitiesForDay(idx) {
  return [...SCHEDULE[idx].morning, ...todaysAfternoon(idx)].filter(a => !a.comingSoon);
}

function afternoonIconsForDay(idx) {
  return SCHEDULE[idx].afternoon.map(a => a.icon).join(' ');
}

// Shared string hash — dateHash/weekHash/monthHash all seed from this,
// each just varying what date string goes in.
function hashSeed(seed) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) {
    h = Math.imul(31, h) + seed.charCodeAt(i) | 0;
  }
  return h >>> 0;
}

// Same day, all day
function dateHash(extra) {
  return hashSeed(new Date().toDateString() + (extra || ''));
}

// Same result all week — seeded from the Monday of the current week
function startOfWeek(d) {
  const date = new Date(d);
  const day = date.getDay(); // 0 Sun .. 6 Sat
  date.setDate(date.getDate() + (day === 0 ? -6 : 1 - day));
  date.setHours(0, 0, 0, 0);
  return date;
}
function weekHash(extra) {
  return hashSeed(startOfWeek(new Date()).toDateString() + (extra || ''));
}

// Same result all month — seeded from year + month only
function monthHash(extra) {
  const n = new Date();
  return hashSeed(n.getFullYear() + '-' + n.getMonth() + (extra || ''));
}

function wotdForToday() {
  // wordOfDayFor() lives in words-data.js — same function Word Explorer's
  // getWordOfDay() calls, including the historical-override check, so
  // both always agree.
  return wordOfDayFor(new Date());
}

}

function skillForThisMonth() {

}

// Seeded random from the date string — same quote all day, random across days
function quoteForToday() {
  return QUOTES[dateHash('quote') % QUOTES.length];
}

function listToSentence(arr) {
  if (arr.length === 0) return '';
  if (arr.length === 1) return arr[0];
  if (arr.length === 2) return arr[0] + ' and ' + arr[1];
  return arr.slice(0, -1).join(', ') + ' and ' + arr[arr.length - 1];
}

function datecardHTML() {
  const now     = new Date();
  const dayName = now.toLocaleDateString('en-GB', { weekday: 'long' });
  const dayNum  = now.toLocaleDateString('en-GB', { day:     'numeric' });
  const month   = now.toLocaleDateString('en-GB', { month:   'long' });
  const year    = now.toLocaleDateString('en-GB', { year:    'numeric' });
  const quote   = quoteForToday();
  return `
    <div class="date-card" role="note" aria-label="Today is ${safeText(dayName)}, ${safeText(dayNum)} ${safeText(month)} ${safeText(year)}">
      <div class="date-body">
        <div class="date-label">Today is</div>
        <div class="date-day">${safeText(dayName)}</div>
        <div class="date-parts">

          <span class="date-month">${safeText(month)}</span>
          <span class="date-sep">·</span>
          <span class="date-year">${safeText(year)}</span>
        </div>
      </div>
      <div class="date-quote" aria-label="Today's inspiration: ${safeText(quote.text)}">

function cardHTML(act) {
  if (act.comingSoon) {
    return `
      <article class="activity-card coming-soon">
        <div class="act-icon" aria-hidden="true">${act.icon}</div>
        <div class="act-name">${safeText(act.name)}</div>
        <div class="act-desc">${safeText(act.desc)}</div>
        <div class="soon-tag">🔒 Coming soon</div>
      </article>`;
  }
  const isDone = done.has(act.id);
  // Real-world activities (e.g. the end-of-month presentation prompt)
  // have nothing to open — mark done in place instead of an outbound link.
  const actionHTML = act.noLink
    ? `<button class="start-btn" type="button" data-id="${act.id}"
         aria-label="${isDone ? 'Done: ' : 'Mark done: '}${safeText(act.name)}"
       >${isDone ? '✓ Done — well done!' : '🎤 We did it!'}</button>`
    : `<a class="start-btn"
         href="${safeText(act.href)}"
         target="_blank"
         rel="noopener noreferrer"
         data-id="${act.id}"
         aria-label="${isDone ? 'Open again: ' : 'Start: '}${safeText(act.name)}"
      >${isDone ? '✓ Done — open again' : '▶ Start'}</a>`;
  return `
    <article class="activity-card${isDone ? ' done' : ''}"
             aria-label="${safeText(act.name)}${isDone ? ' — completed' : ''}">
      ${isDone ? '<div class="tick-badge" aria-label="Completed">✓</div>' : ''}
      <div class="act-icon" aria-hidden="true">${act.icon}</div>
      <div class="act-name">${safeText(act.name)}</div>
      <div class="act-desc">${safeText(act.desc)}</div>
      ${actionHTML}
    </article>`;
}

/* ─────────────────────────────────────────────────────────────────
   RENDER — summary
───────────────────────────────────────────────────────────────── */
function summaryHTML(dayIdx) {
  const allActs   = activitiesForDay(dayIdx);
  const completed = allActs.filter(a => done.has(a.id));
  if (completed.length === 0) {
    return `<section class="day-summary" aria-live="polite"></section>`;
  }
  const chips = completed.map(a =>
    `<span class="summary-chip"><span class="chip-tick" aria-hidden="true">✓</span>${safeText(a.icon)} ${safeText(a.name)}</span>`
  ).join('');
  const phrases  = completed.map(a => PHRASES[a.id]).filter(Boolean);
  const sentence = `Cairo ${listToSentence(phrases)} today — ${completed.length} out of ${allActs.length} sessions done. Brilliant work! 🌟`;
  return `
    <section class="day-summary visible" aria-live="polite" aria-label="Cairo's progress today">
      <div class="summary-header">🌟 Cairo's progress today</div>
      <div class="summary-chips">${chips}</div>
      <div class="summary-message">${safeText(sentence)}</div>
    </section>`;
}

  document.getElementById('greeting').textContent =
    h < 12 ? 'Good morning, Cairo! ☀️'
    : h < 17 ? 'Good afternoon, Cairo! 🌤️'
    : 'Good evening, Cairo! 🌙';

  document.getElementById('header-date').textContent =
    new Date().toLocaleDateString('en-GB', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });

  // Week bar (read-only — shows all 5 days, today highlighted)
  // Use 0 (Mon) as fallback highlight on weekends so bar still renders
  renderWeekBar(todayIdx ?? 0);

  // Panel
  if (todayIdx === null) {
    renderWeekend();
  } else {
    renderSchoolDay(todayIdx);

    // Mark done when Start is clicked; brief delay lets the tab open first
    document.getElementById('day-panel').addEventListener('click', e => {
      // WOTD speaker
      if (e.target.closest('[data-action="speak-wotd"]')) {
        const w = wotdForToday();
        speakSequence([w.word, 'you could also say: ' + w.synonyms.slice(0, 4).join(', '), w.story], 900);
        return;
      }
      // Activity start → mark done
      const link = e.target.closest('.start-btn[data-id]');
      if (!link) return;
      done.add(link.dataset.id);
      setTimeout(() => renderSchoolDay(todayIdx), 150);
    });
  }
})();
</script>

</body>
</html>

<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EEF0EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wonder Hour">
<title>Wonder Hour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#EEF0EA; --surface:#F8F9F5; --ink:#1D2622; --muted:#56615B;
  --accent:#2F5D50; --glow:#B87D1C; --glow-soft:#F3E3C2; --line:#D3D8CF;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --body:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --ground:#131915; --surface:#1B231F; --ink:#E4EAE3; --muted:#9BA69F;
    --accent:#86BFAA; --glow:#E7B458; --glow-soft:#3A2F1C; --line:#2B3530;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--body); font-size:18px; line-height:1.5;
  padding:env(safe-area-inset-top,0px) 16px calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px; margin:0 auto}
h1,h2,h3{font-family:var(--display); margin:0; line-height:1.15; text-wrap:balance}
p{margin:0}
a{color:var(--accent); text-underline-offset:3px}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--glow); outline-offset:2px}
.label{font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}

header{padding:20px 0 12px; display:flex; justify-content:space-between; align-items:baseline; gap:12px}
header h1{font-size:26px; font-weight:700}
header h1 span{color:var(--glow)}

.tabs{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--ground); padding:8px 0 10px; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto; min-width:64px; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:8px 12px; text-align:left; cursor:pointer; display:grid; gap:1px}
.tab b{font-family:var(--display); font-size:16px; font-weight:600}
.tab small{font-family:var(--mono); font-size:11px; color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:var(--ground)}
.tab[aria-selected="true"] small{color:var(--ground); opacity:.8}
.tab .today{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--glow)}
.tab[aria-selected="true"] .today{color:var(--glow-soft)}

.hero{padding:18px 0 6px; display:grid; gap:10px}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-family:var(--mono); font-size:11.5px; padding:4px 10px; border-radius:999px; border:1px solid var(--line); color:var(--accent)}
.chip.warm{background:var(--glow-soft); border-color:transparent; color:var(--ink)}
.hero h2{font-size:32px; font-weight:700; letter-spacing:-.01em}
.hero .thread{font-style:italic; color:var(--muted); font-size:17px}

.tonight{margin-top:16px; background:var(--glow-soft); border-radius:14px; padding:14px 16px; display:grid; gap:8px}
.tonight ul{margin:0; padding-left:20px; display:grid; gap:4px; font-size:16.5px}
.need{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px}
.need span{font-size:14px; padding:3px 10px; border-radius:8px; background:var(--surface)}

.overview{margin-top:18px; border:1px solid var(--line); border-radius:14px; background:var(--surface); overflow:hidden}
.overview a{display:grid; grid-template-columns:48px 1fr auto; gap:10px; padding:10px 14px; text-decoration:none; color:var(--ink); border-top:1px solid var(--line); font-size:16px; align-items:baseline}
.overview a:first-child{border-top:0}
.overview .t{font-family:var(--mono); font-size:12px; color:var(--glow)}
.overview .m{font-family:var(--mono); font-size:11.5px; color:var(--muted)}

.beat{padding:26px 0 4px; display:grid; gap:12px; scroll-margin-top:84px}
.beat + .beat{border-top:1px solid var(--line)}
.beat-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.beat-name{font-family:var(--display); font-weight:700; font-size:15px; color:var(--accent); text-transform:uppercase; letter-spacing:.06em}
.beat-time{font-family:var(--mono); font-size:12px; color:var(--muted)}
.beat h3{font-size:23px; font-weight:600}
.say{font-size:19px; line-height:1.45; padding-left:14px; border-left:3px solid var(--glow)}
.say .label{display:block; color:var(--glow); margin-bottom:2px}
.ask{display:grid; gap:6px}
.ask ul{margin:0; padding-left:20px; display:grid; gap:6px; font-size:17px}
.ask li::marker{color:var(--accent)}
details{background:var(--surface); border:1px solid var(--line); border-radius:12px}
summary{cursor:pointer; padding:12px 14px; font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); list-style:none; display:flex; justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"+"; font-size:16px; line-height:1}
details[open] summary::after{content:"–"}
details > div{padding:0 14px 14px; display:grid; gap:10px; font-size:16.5px}
.src{font-family:var(--mono); font-size:12px; color:var(--muted); word-break:break-word}
.opts{display:grid; gap:8px}
.opt{display:grid; grid-template-columns:14px 1fr; gap:10px; align-items:start; font-size:16px}
.opt i{width:14px; height:14px; border-radius:50%; margin-top:5px}
.opt b{font-family:var(--display); font-weight:600}

.carry{margin-top:26px; padding:22px 18px; border-radius:16px; background:var(--accent); color:var(--ground); display:grid; gap:8px}
.carry .label{color:var(--ground); opacity:.75}
.carry p{font-family:var(--display); font-size:22px; font-weight:500; line-height:1.3}

.log{margin-top:26px; display:grid; gap:10px}
.log h3{font-size:20px; font-weight:600}
.log p{font-size:15.5px; color:var(--muted)}
textarea{width:100%; min-height:120px; resize:vertical; font:inherit; font-size:17px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink)}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.btn{border:1px solid var(--accent); background:transparent; color:var(--accent); border-radius:10px; padding:9px 14px; font-family:var(--display); font-size:15px; font-weight:600; cursor:pointer}
.status{font-family:var(--mono); font-size:12px; color:var(--muted)}

.box{margin-top:34px; padding-top:20px; border-top:1px solid var(--line); display:grid; gap:10px}
.box h3{font-size:20px; font-weight:600}
.box ul{margin:0; padding:0; list-style:none; display:grid; gap:8px}
.box li{display:grid; grid-template-columns:44px 1fr; gap:8px; font-size:16.5px}
.box li span{font-family:var(--mono); font-size:12px; color:var(--glow); padding-top:4px}
.box small{display:block; color:var(--muted); font-size:14.5px}
footer{margin-top:30px; font-family:var(--mono); font-size:11.5px; color:var(--muted); text-align:center}
@media (prefers-reduced-motion: no-preference){ html{scroll-behavior:smooth} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Wonder <span>Hour</span></h1>
    <span class="label" id="weekLabel"></span>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Days"></nav>
  <main id="day"></main>
  <section class="box" id="box"></section>
  <footer>Private notes · updated every Sunday</footer>
</div>

<script src="week.js"></script>
<script>
(function () {
  var W = window.WONDER_WEEK;
  if (!W) { document.getElementById("day").textContent = "This week's wonders haven't loaded. Check your connection and refresh."; return; }

  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "text") el.textContent = attrs[k];
      else if (k === "cls") el.className = attrs[k];
      else el.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) el.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return el;
  }
  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function parse(s) { var p = s.split("-"); return new Date(+p[0], p[1] - 1, +p[2]); }
  var DAY = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function store(key, val) { try { if (val === undefined) return localStorage.getItem(key) || ""; localStorage.setItem(key, val); } catch (e) { return ""; } }

  var todayIso = iso(new Date());
  var idx = W.days.findIndex(function (d) { return d.date === todayIso; });
  if (idx < 0) idx = W.days.findIndex(function (d) { return d.date > todayIso; });
  if (idx < 0) idx = W.days.length - 1;
  var hash = location.hash.replace("#", "");
  var hashIdx = W.days.findIndex(function (d) { return d.date === hash; });
  if (hashIdx >= 0) idx = hashIdx;

  document.getElementById("weekLabel").textContent = W.label;

  var tabs = document.getElementById("tabs");
  W.days.forEach(function (d, i) {
    var dt = parse(d.date);
    var b = h("button", { cls: "tab", role: "tab", type: "button", "aria-selected": i === idx ? "true" : "false" }, [
      d.date === todayIso ? h("span", { cls: "today", text: "Today" }) : null,
      h("b", { text: DAY[dt.getDay()] + " " + dt.getDate() }),
      h("small", { text: d.lens })
    ]);
    b.addEventListener("click", function () { select(i); window.scrollTo(0, 0); });
    tabs.appendChild(b);
  });

  function select(i) {
    idx = i;
    Array.prototype.forEach.call(tabs.children, function (t, j) { t.setAttribute("aria-selected", j === i ? "true" : "false"); });
    try { history.replaceState(null, "", "#" + W.days[i].date); } catch (e) {}
    render(W.days[i]);
  }

  function render(d) {
    var main = document.getElementById("day");
    main.textContent = "";
    var dt = parse(d.date);
    var isPast = d.date < todayIso, isToday = d.date === todayIso;

    main.appendChild(h("div", { cls: "hero" }, [
      h("div", { cls: "chips" }, [
        h("span", { cls: "chip", text: d.lens }),
        h("span", { cls: "chip warm", text: "Did you know · " + d.interest })
      ]),
      h("span", { cls: "label", text: DAY[dt.getDay()] + " " + dt.getDate() + " " + MON[dt.getMonth()] + (isToday ? " · today" : isPast ? " · done" : "") }),
      h("h2", { text: d.title }),
      h("p", { cls: "thread", text: d.thread })
    ]));

    main.appendChild(h("div", { cls: "tonight" }, [
      h("span", { cls: "label", text: isToday ? "You'll need" : "The night before" }),
      h("ul", null, d.tonight.map(function (t) { return h("li", { text: t }); })),
      h("div", { cls: "need" }, d.need.map(function (n) { return h("span", { text: n }); }))
    ]));

    var ov = h("nav", { cls: "overview", "aria-label": "The hour" });
    d.beats.forEach(function (b, i) {
      var a = h("a", { href: "#beat-" + i }, [h("span", { cls: "t", text: b.time }), h("span", { text: b.name }), h("span", { cls: "m", text: b.mins + " min" })]);
      a.addEventListener("click", function (e) { e.preventDefault(); document.getElementById("beat-" + i).scrollIntoView(); });
      ov.appendChild(a);
    });
    var ca = h("a", { href: "#carry" }, [h("span", { cls: "t", text: "0:55" }), h("span", { text: "Carry it" }), h("span", { cls: "m", text: "5 min" })]);
    ca.addEventListener("click", function (e) { e.preventDefault(); document.getElementById("carry").scrollIntoView(); });
    ov.appendChild(ca);
    main.appendChild(ov);

    d.beats.forEach(function (b, i) {
      var sec = h("section", { cls: "beat", id: "beat-" + i }, [
        h("div", { cls: "beat-top" }, [h("span", { cls: "beat-name", text: b.name }), h("span", { cls: "beat-time", text: b.time + " · " + b.mins + " min" })]),
        h("h3", { text: b.heading }),
        h("p", { cls: "say" }, [h("span", { cls: "label", text: "Say" }), "“" + b.say + "”"]),
        h("div", { cls: "ask" }, [h("span", { cls: "label", text: b.askLabel || "Ask" }), h("ul", null, b.ask.map(function (q) { return h("li", { text: q }); }))])
      ]);
      if (b.options) {
        sec.appendChild(h("details", null, [
          h("summary", { text: b.optionsLabel || "Options" }),
          h("div", { cls: "opts" }, b.options.map(function (o) {
            var dot = h("i"); dot.style.background = o.colour;
            return h("div", { cls: "opt" }, [dot, h("p", null, [h("b", { text: o.name + ". " }), o.text])]);
          }))
        ]));
      }
      if (b.pocket) {
        var inner = h("div", null, [h("p", { text: b.pocket })]);
        if (b.source) inner.appendChild(h("p", { cls: "src" }, ["Source: ", h("a", { href: b.source.url, target: "_blank", rel: "noopener", text: b.source.label })]));
        sec.appendChild(h("details", null, [h("summary", { text: b.pocketLabel || "Back pocket" }), inner]));
      }
      main.appendChild(sec);
    });

    main.appendChild(h("div", { cls: "carry", id: "carry" }, [
      h("span", { cls: "label", text: "0:55 · Carry it · then let the hour end" }),
      h("p", { text: "“" + d.carry + "”" })
    ]));

    var key = "wonderHour_log_" + d.date;
    var ta = h("textarea", { id: "log-" + d.date, placeholder: "e.g. Why don't pine trees lose their leaves?", "aria-label": "Their questions" });
    ta.value = store(key);
    var status = h("span", { cls: "status" });
    ta.addEventListener("input", function () { store(key, ta.value); status.textContent = "Saved on this phone"; });
    var copy = h("button", { cls: "btn", type: "button", text: "Copy the week's questions" });
    copy.addEventListener("click", function () {
      var text = W.days.map(function (x) { var v = store("wonderHour_log_" + x.date).trim(); return v ? x.date + " (" + x.title + "):\n" + v : ""; }).filter(Boolean).join("\n\n");
      if (!text) { status.textContent = "No questions logged yet"; return; }
      var done = function () { status.textContent = "Copied. Paste it to Claude on Sunday."; };
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, function () { ta.value = text; ta.select(); status.textContent = "Select and copy the text above"; });
      else { ta.value = text; ta.select(); status.textContent = "Select and copy the text above"; }
    });
    main.appendChild(h("section", { cls: "log" }, [
      h("h3", { text: "Wonder log" }),
      h("p", { text: "What did they ask? Their questions help choose next week's wonders. This stays on your phone." }),
      ta, h("div", { cls: "row" }, [copy, status])
    ]));
  }

  var box = document.getElementById("box");
  box.appendChild(h("span", { cls: "label", text: "This week's wonder box" }));
  box.appendChild(h("h3", { text: "Objects to gather" }));
  box.appendChild(h("ul", null, W.boxList.map(function (o) {
    return h("li", null, [h("span", { text: o.day }), h("div", null, [o.item, o.backups ? h("small", { text: "or " + o.backups.join(", ") }) : null])]);
  })));

  render(W.days[idx]);
})();
</script>
</body>
</html>
